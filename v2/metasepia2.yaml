pcbs:
  metasepia2:
    template: kicad8
    outlines.main.outline: body
    footprints:
      switches:
        what: hs-mx
        where: switches
        params:
          #side: B
          left: "{{row_net}}"
          right: "{{colrow}}"
      encoder: 
        what: ceoloide/rotary_encoder_ec11_ec12
        where: [encoder]
        adjust.rotate: 180
        params:
          include_plated_mounting_holes: false
          encoder_pads_position: 8.254
          S1: "{{colrow}}"
          S2: "{{row_net}}"
          A: "{{a_net}}"
          C: "{{c_net}}"
      diodes:
        what: diode-tht
        where: [switches, encoder]
        adjust.resist: true # prevents flipped diodes on right half
        adjust.shift: [8.1, -2.2]
        adjust.rotate: -90
        params:
          side: B
          from: "{{colrow}}"
          to: "{{col_net}}"
      mousebites:
        what: ceoloide/mounting_hole_npth
        where: [mousebites]
        params:
          hole_size: "{{hole_size}}"
          hole_drill: "{{hole_size}}"
      mths:
        what: ceoloide/mounting_hole_npth
        where: /mth/
        params:
          hole_size: mth_pcb
          hole_drill: mth_pcb
      mcu:
        what: mcu_nice_nano
        where: mcu
        params:
          reversible: true
          only_required_jumpers: true
          P1: R0
          P0: R1
          P2: SDA
          P3: SCL
          P4: R2
          P5: R3
          P6: R4
          P7: R5
          P8: enc1
          P9: enc2

          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: R6
          P16: enc3
          P10: enc4
      display:
        what: ceoloide/display_ssd1306
        where: /display/
        adjust.shift: [0, -0.69]
          #ref: mcu
          #shift: [0, mcu_y/2+16.7-38+1.5] # precisely line up the front edge
          #shift: [0, mcu_y/2-19.7]
          #shift: [0, -2]
      reset6x6:
        what: button-6x6
        where: /reset/
        params:
          P1: RST
          P2: GND
      resetalps:
        what: button
        where: /reset/
        params:
          from: RST
          to: GND
      slider:
        what: ceoloide/power_switch_smd_side
        where: /slider/
        adjust.rotate: 90
        params:
          side: B
          from: RAW
          to: battery
      jst:
        what: ceoloide/battery_connector_jst_ph_2
        where: /jst/
        adjust.shift: [0, 4.35]
        params:
          reversible: false
          BAT_P: battery
          BAT_N: GND
  mx_plate:
    template: kicad8
    outlines.main.outline: _mx_plate
    footprints:
      mousebites:
        what: ceoloide/mounting_hole_npth
        where: [mousebites]
        params:
          hole_size: "{{hole_size}}"
          hole_drill: "{{hole_size}}"
      mths:
        what: ceoloide/mounting_hole_npth
        where: /mth/
        params:
          #hole_size: "{{hole_size}}"
          #hole_drill: "{{hole_size}}"

  choc_plate:
    template: kicad8
    outlines.main.outline: _choc_plate
    footprints:
      mousebites:
        what: ceoloide/mounting_hole_npth
        where: [mousebites]
        params:
          hole_size: "{{hole_size}}"
          hole_drill: "{{hole_size}}"
      mths:
        what: ceoloide/mounting_hole_npth
        where: /mth/
        params:
          #hole_size: "{{hole_size}}"
          #hole_drill: "{{hole_size}}"
