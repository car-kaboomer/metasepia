  author: car kaboomer
  
units:
  kx: u # spacing
  ky: kx
  kcx: 18 # size of a keycap
  kcy: kcx
  kco: 14 # cutout size for switch

  $default_width: u # can't be a variable, as ergogen throws an error
  $default_height: u

  # ==================== layout ====================
  pinky_splay: 6 
  pinky_stagger: 0.675ky # pinky to ring
  ring_splay: 3 # 3
  ring_stagger: 0.25ky # ring to middle
  index_stagger: -0.5ky # middle to index 
  # ^ big number = low thumb; small number = wide thumb
  inner_stagger: -0.35ky # index to inner
  thumb_stagger: 0
  tucky_splay: -0 # tucky thumb's angle relative to reachy
  reachy_angle: -18 # reachy thumb's angle relative to index col
  thumb_x: 0.4kx
  thumb_y: -ky
  mcu_shift: 7.9 # 20 # mcu's location in Y, relative to the inner keys' corners
  angle: 20  # 30 # between halves
  thumb_curve: 0.65ky # y value to stretch/retract curve between hands

# ==================== object sizes ====================
  
  mcu_x: 17.78 # measurements; xiao: 17.8x21, pm: 17*33
  mcu_y: 33
  reset_x: 8 # alps skqg + 6x6
  reset_y: 6 # 5.3
  slider_x: 8 # skmc02
  slider_y: 3.01
  jst_x: 6.9 # ph 2p
  jst_y: 12.35 # male included
  display_x: 12
  display_y: 38
  cut_width: 1.01 # expand value. Only needed because [sx, sy] variables exclude expansion
  mth_pcb: 5.5
  mth_plate: 2.2

  plate: 4.6
  spacing: mcu_x + 2

points.zones:
  matrix: 
    anchor.shift: [90, -70]
    rotate: -angle + pinky_splay + ring_splay
    mirror:
      ref: matrix_inner_top
      shift: [kx/2, kx/2]
      distance: spacing
    key:
      spread: kx
      padding: ky
      tags: switches # this will help place footprints correctly in pcbs and outlines
    rows:
      bottom.row_net: R4
      bottom.mirror.row_net: R5
      home.row_net: R2
      home.mirror.row_net: R3
      top.row_net: R0
      top.mirror.row_net: R1
    columns.pinky.rows.bottom.tags: [switches, bites]
    columns.pinky.key:
      col_net: C0
      mirror.col_net: C4
    columns.ring.key:
      stagger: pinky_stagger
      origin: [-kx/2, -ky/2]
      splay: -pinky_splay
      col_net: C1
      mirror.col_net: C3
    columns.middle.key:
      stagger: ring_stagger
      origin: [-kx/2, -ky/2]
      splay: -ring_splay
      col_net: C2
    columns.index.key:
      stagger: index_stagger
      col_net: C3
      mirror.col_net: C1
    columns.inner.rows.bottom.skip: true
    columns.inner.key:
      stagger: inner_stagger
      col_net: C4
      mirror.col_net: C0
  thumb: # thumbs
    anchor:
      ref: matrix_index_bottom
      shift: [thumb_x, thumb_y]
    mirror.$extends: points.zones.matrix.mirror
    key.$extends: points.zones.matrix.key
    columns:
      tucky.key:
        origin: [-kx/2, ky/2]
        splay: tucky_splay
        row_net: R4
        col_net: C4
        mirror.row_net: R5
        mirror.col_net: C0
      reachy.key:
        stagger: thumb_stagger
        origin: [-kx/2, -ky/2]
        splay: reachy_angle
        row_net: R6
        col_net: C4
        mirror.col_net: C0
  mcu.anchor: # reference point, primarily for the mcu
    aggregate.parts: 
      - ref: matrix_inner_top
        shift: [kx/2, ky/2]
      - ref: mirror_matrix_inner_top
        shift: [kx/2, ky/2]
    shift: [0, -mcu_y/2 + mcu_shift]
  display.anchor:
    ref: mcu
    shift: [0, mcu_y/2-display_y/2] # precisely line up board & display edges
  encoders: # knobs :P
    mirror.$extends: points.zones.matrix.mirror
    anchor: 
      ref: matrix_inner_home
      shift: [kx, -ky/2-2]
    key.tags: [encoder, switches]
    key.col_net: C3
    key.row_net: R6
    key.mirror.col_net: C1
    key.a_net: enc1
    key.c_net: enc2
    key.mirror.a_net: enc3
    key.mirror.c_net: enc4
  #center_encoder: # CENTER ENCODER
  #  key.tags: [encoder]
  #  anchor:
  #    ref: mcu
  #    shift: [0, -mcu_y/2 -ky/2-5]
  #  key.col_net:
  #  key.row_net:
  #  key.a_net: enc1
  #  key.c_net: enc2

  ref_curve.anchor:  # reference point for the bottom
    aggregate.parts: [thumb_reachy, mirror_thumb_reachy]
    shift: [0, ky-10]
  mth_1: # TOP PINKY
    mirror.$extends: points.zones.matrix.mirror
    anchor.aggregate.parts: [matrix_pinky_top, matrix_ring_top]
    anchor.shift: [-1, 0]
  mth_2: # BOT PINKY
    mirror.$extends: points.zones.matrix.mirror
    anchor.aggregate.parts: [matrix_pinky_home, matrix_ring_home]
    anchor.shift: [1.05, -2.8]
  mth_3: # TOP INDEX
    mirror.$extends: points.zones.matrix.mirror
    anchor.aggregate:
      method: intersect
      parts: 
        - ref: matrix_index_top
          shift: [(kco+mth_pcb)/2+2, 0]
        - ref: matrix_inner_top
          shift: [0, (kco+mth_pcb)/2+1]
          rotate: 90
  mth_4: # THUMB
    mirror.$extends: points.zones.matrix.mirror
    anchor.aggregate.parts: 
      - ref: matrix_middle_bottom
        shift: [-kx/2, -ky/2] 
      - ref: thumb_tucky
        shift: [kx/2, -ky/2] 
  mth_5: # THUMB REACHY
    mirror.$extends: points.zones.matrix.mirror
    anchor.aggregate.method: intersect
    anchor.aggregate.parts:
      - ref: encoders
        shift: [0, -ky/2-2]
        rotate: 90
      - ref: thumb_reachy
        shift: [0, 0]


  slider: # power switch
    anchor:
      aggregate.method: intersect
      aggregate.parts:
        - ref: matrix_index_top
          shift: [0, ky/2]
          rotate: 90
        - ref: matrix_inner_top
      orient: -angle + 7
      shift: [0, -slider_y/2+0.25]
  reset: # reset switch
    anchor:
      - ref.aggregate.parts:
        - ref: matrix_inner_home
        - ref.aggregate.parts: [thumb_tucky, thumb_reachy]
      - ref: matrix_inner_home
        affect: r
  jst: # battery connector
    mirror.$extends: points.zones.matrix.mirror
    key.asym: right
    anchor:
      - ref: matrix_inner_home
        shift: [kco/2+1, -kco/2-3.5]
      - shift: [-jst_x/2, -jst_y/2]
        rotate: 180
  mousebites: &mb1 # outer edge
    key.spread: 0.64
    key.padding: -0.64
    key.tags: mousebites
    key.hole_size: 0.38
    mirror.$extends: points.zones.matrix.mirror
    anchor:
      ref: matrix_pinky_bottom
      shift: [-kx/2, ky/2]
    columns:
      1:    #0
      2:    #0,64
      3:    #1,128
      4:    #1,776
      5:    #2,432
      6:    #3,2
  mousebites2: &mb2 # inner horizontal
    <<: *mb1
    key.spread: -0.64
    anchor.shift: [kx/2, ky/2]
  mousebites3:
    <<: *mb2
    columns:
    rows:
      1.skip: true #0
      2:    #0,64
      3:    #1,128
      4:    #1,776
      5:    #2,432
      6:    #3,2
  

outlines:
# =============== components =============
# (and their raw placements + dimensions)
  _mcu:
    - what: rectangle
      size: [mcu_x, mcu_y]
      where: /mcu/
        #corner: 1.5 # only for xiao
  _reset:
    - what: rectangle
      size: [reset_x, reset_y]
      where: /reset/
  _slider:
    - what: rectangle
      size: [slider_x, slider_y+1]
      where: /slider/
      adjust.shift: [0, -0.5] # compensation for center of zone vs center of footprint
  _jst:
    - what: rectangle
      where: /jst/
      #adjust.shift: [0, 4.35]
      size: [jst_x, jst_y]
  _display:
    - what: rectangle
      size: [display_x, display_y]
      #18.3+19.7]
      where: /display/
    - what: rectangle
      where: /display/
      adjust.shift: [0, -display_y/2+sy/2]
      size: [11.22, 3.55]
      operation: stack
  _mth_pcb:
    - what: circle
      where: /mth/
      radius: mth_pcb/2
  _mth_plate:
    - what: circle
      where: /mth/
      radius: mth_plate/2

# ================= intermediate =================
# (will be reused eventually in the config)
  _mousebite_cuts: 
    - what: rectangle # lateral
      size: [12.6, cut_width]
      where: [bites]
      adjust.shift: [0, -cut_width/2+ky/2]
      corner: 0.3
      #expand: cut_width/2.5
    - what: rectangle # vertical
      size: [cut_width, ky-pinky_stagger-3.2+cut_width/2]
      where: [bites] # fix right side not being cut
      adjust.shift: [-cut_width/2+kx/2+0.3, ky/2-3.2-sy/2]
      corner: 0.3
  _main: # main block
    - what: path
      segments: 
        - type: line
          points:
            #- ref: matrix_inner_top
            #  shift: [-kx/2, ky/2] 
            - ref: matrix_index_top
              shift: [kx/2, ky/2]
            - ref: matrix_index_top
              shift: [-kx/2, ky/2]
            - ref: matrix_middle_top
              shift: [kx/2, ky/2]
            - ref: matrix_middle_top
              shift: [-kx/2, ky/2]
            - aggregate.method: intersect
              aggregate.parts:
                - ref: matrix_ring_top
                  shift: [0, ky/2]
                  rotate: 90
                - ref: matrix_middle_top
                  shift: [-kx/2, 0]
            - ref: matrix_ring_top
              shift: [-kx/2, ky/2]
            - aggregate.method: intersect
              aggregate.parts:
                - ref: matrix_pinky_top
                  shift: [0, ky/2]
                  rotate: 90
                - ref: matrix_ring_top
                  shift: [-kx/2, 0]
            - ref: matrix_pinky_top
              shift: [-kx/2, ky/2]
            - ref: matrix_pinky_bottom
              shift: [-kx/2, -ky/2]
            - ref: matrix_pinky_bottom
              shift: [kx/2, -ky/2]
            - ref: matrix_ring_bottom
              shift: [-kx/2, -ky/2]
        - type: bezier # SIDE CURVE LEFT
          points:
            - shift: [2.5kx, 0]
            - ref:
              - ref: thumb_tucky
                shift: [-kx/2, -ky/2]
              - ref: thumb_reachy
                orient: thumb_tucky
                affect: r
              - shift: [0, ky]
            - ref: thumb_tucky
              shift: [-kx/2, -ky/2]
            #- ref: thumb_tucky
            #  shift: [-kx, -ky/2]
            #- ref: thumb_tucky
            #  shift: [-kx/2, -ky/2]
        - type: line
          points:
            #- ref: thumb_tucky
            #  shift: [kx/2, -ky/2]
            - ref: thumb_reachy
              shift: [kx/2, -ky/2]
            - ref: thumb_reachy
              shift: [kx/2, -ky/2]
            - ref: thumb_reachy
              shift: [kx/2, ky/2]
            #- ref: thumb_reachy
            #  shift: [0, ky/2]
        - type: bezier # CENTER CURVE
          points:
            - shift: [0, thumb_curve]
            - ref: mirror_thumb_reachy
              shift: [kx/2, ky/2 + thumb_curve] # first values are those of next point
            #- ref: mirror_thumb_reachy
            #  shift: [0, ky/2]
            - ref: mirror_thumb_reachy
              shift: [kx/2, ky/2]
        - type: line
          points:
            #- ref: mirror_thumb_reachy
            #  shift: [kx/2, -ky/2]
            - ref: mirror_thumb_reachy
              shift: [kx/2, -ky/2]
            #- ref: mirror_thumb_tucky
            #  shift: [kx/2, -ky/2]
            - ref: mirror_thumb_tucky
              shift: [-kx/2, -ky/2]
        - type: bezier # SIDE CURVES
          points:
            - ref: 
              - ref: mirror_thumb_tucky
                shift: [-kx/2, -ky/2]
              - ref: mirror_thumb_reachy
                orient: mirror_thumb_tucky
                affect: r
              shift: [0, ky]
            - ref: mirror_matrix_ring_bottom
              shift: [-kx/2 +2.5kx, -ky/2]
            - ref: mirror_matrix_ring_bottom
              shift: [-kx/2, -ky/2]
        - type: line
          points:
            - ref: mirror_matrix_pinky_bottom
              shift: [kx/2, -ky/2]
            - ref: mirror_matrix_pinky_bottom
              shift: [-kx/2, -ky/2]
            - ref: mirror_matrix_pinky_top
              shift: [-kx/2, ky/2]
            - ref: mirror_matrix_pinky_top
              shift: [-kx/2, ky/2]
            - aggregate.method: intersect
              aggregate.parts:
                - ref: mirror_matrix_pinky_top
                  shift: [0, ky/2]
                  rotate: 90
                - ref: mirror_matrix_ring_top
                  shift: [-kx/2, 0]
            - ref: mirror_matrix_ring_top
              shift: [-kx/2, ky/2]
            - aggregate.method: intersect
              aggregate.parts:
                - ref: mirror_matrix_ring_top
                  shift: [0, ky/2]
                  rotate: 90
                - ref: mirror_matrix_middle_top
                  shift: [-kx/2, 0]
            - ref: mirror_matrix_middle_top
              shift: [-kx/2, ky/2]
            - ref: mirror_matrix_middle_top
              shift: [kx/2, ky/2]
            - ref: mirror_matrix_index_top
              shift: [-kx/2, ky/2]
            - ref: mirror_matrix_index_top
              shift: [kx/2, ky/2]
        - type: bezier # smooth, but tall
          points:
            - shift: [1kx, 0]
            - ref: matrix_index_top
              shift: [kx/2 + 1kx, ky/2]
            - ref: matrix_index_top
              shift: [kx/2, ky/2]
  main_cut: # main block
    - what: path
      segments: 
        - type: line
          points:
            #- ref: matrix_inner_top
            #  shift: [-kx/2, ky/2] 
            - ref: matrix_index_top
              shift: [kx/2, ky/2]
            - ref: matrix_index_top
              shift: [-kx/2, ky/2]
            - ref: matrix_middle_top
              shift: [kx/2, ky/2]
            - ref: matrix_middle_top
              shift: [-kx/2, ky/2]
            - aggregate.method: intersect
              aggregate.parts:
                - ref: matrix_ring_top
                  shift: [0, ky/2]
                  rotate: 90
                - ref: matrix_middle_top
                  shift: [-kx/2, 0]
            - ref: matrix_ring_top
              shift: [-kx/2, ky/2]
            - aggregate.method: intersect
              aggregate.parts:
                - ref: matrix_pinky_top
                  shift: [0, ky/2]
                  rotate: 90
                - ref: matrix_ring_top
                  shift: [-kx/2, 0]
            - ref: matrix_pinky_top
              shift: [-kx/2, ky/2]
            - ref: matrix_pinky_home
              shift: [-kx/2, -ky/2]
##############################################
# edit here, left side udner palm, must edit bezier
# to make it smooth toward thum 
#############################################
        - type: bezier # SIDE CURVE LEFT
          points:
            - shift: [2.5kx, -ky/2]
            - ref:
              - ref: thumb_tucky
                shift: [-kx/2, -ky/2]
              - ref: thumb_reachy
                orient: thumb_tucky
                affect: r
              - shift: [0, ky]
            - ref: thumb_tucky
              shift: [-kx/2, -ky/2]
            #- ref: thumb_tucky
            #  shift: [-kx, -ky/2]
            #- ref: thumb_tucky
            #  shift: [-kx/2, -ky/2]
        - type: line
          points:
            #- ref: thumb_tucky
            #  shift: [kx/2, -ky/2]
            - ref: thumb_reachy
              shift: [kx/2, -ky/2]
            - ref: thumb_reachy
              shift: [kx/2, -ky/2]
            - ref: thumb_reachy
              shift: [kx/2, ky/2]
            #- ref: thumb_reachy
            #  shift: [0, ky/2]
        - type: bezier # CENTER CURVE
          points:
            - shift: [0, thumb_curve]
            - ref: mirror_thumb_reachy
              shift: [kx/2, ky/2 + thumb_curve] # first values are those of next point
            #- ref: mirror_thumb_reachy
            #  shift: [0, ky/2]
            - ref: mirror_thumb_reachy
              shift: [kx/2, ky/2]
        - type: line
          points:
            #- ref: mirror_thumb_reachy
            #  shift: [kx/2, -ky/2]
            - ref: mirror_thumb_reachy
              shift: [kx/2, -ky/2]
            #- ref: mirror_thumb_tucky
            #  shift: [kx/2, -ky/2]
            - ref: mirror_thumb_tucky
              shift: [-kx/2, -ky/2]
        - type: bezier # SIDE CURVES
          points:
            - ref: 
              - ref: mirror_thumb_tucky
                shift: [-kx/2, -ky/2]
              - ref: mirror_thumb_reachy
                orient: mirror_thumb_tucky
                affect: r
              shift: [0, ky]
            - ref: mirror_matrix_ring_bottom
              shift: [-kx/2 +2.5kx, -ky/2]
            - ref: mirror_matrix_ring_bottom
              shift: [-kx/2, -ky/2]
        - type: line
          points:
            - ref: mirror_matrix_pinky_bottom
              shift: [kx/2, -ky/2]
            - ref: mirror_matrix_pinky_bottom
              shift: [-kx/2, -ky/2]
            - ref: mirror_matrix_pinky_top
              shift: [-kx/2, ky/2]
            - ref: mirror_matrix_pinky_top
              shift: [-kx/2, ky/2]
            - aggregate.method: intersect
              aggregate.parts:
                - ref: mirror_matrix_pinky_top
                  shift: [0, ky/2]
                  rotate: 90
                - ref: mirror_matrix_ring_top
                  shift: [-kx/2, 0]
            - ref: mirror_matrix_ring_top
              shift: [-kx/2, ky/2]
            - aggregate.method: intersect
              aggregate.parts:
                - ref: mirror_matrix_ring_top
                  shift: [0, ky/2]
                  rotate: 90
                - ref: mirror_matrix_middle_top
                  shift: [-kx/2, 0]
            - ref: mirror_matrix_middle_top
              shift: [-kx/2, ky/2]
            - ref: mirror_matrix_middle_top
              shift: [kx/2, ky/2]
            - ref: mirror_matrix_index_top
              shift: [-kx/2, ky/2]
            - ref: mirror_matrix_index_top
              shift: [kx/2, ky/2]
        - type: bezier # smooth, but tall
          points:
            - shift: [1kx, 0]
            - ref: matrix_index_top
              shift: [kx/2 + 1kx, ky/2]
            - ref: matrix_index_top
              shift: [kx/2, ky/2]
  body:
    - name: _main
      fillet: 1.5
    - name: body
      fillet: 0.4
  _pcb_body:
    - body
    - -_mousebite_cuts
  _center_cutout:
    - body
    - what: polygon
      points:
        - ref: mcu # mcu top left
          shift: [-mcu_x/2, mcu_y/2]
        - ref: mcu # mcu bottom left
          shift: [-mcu_x/2, -mcu_y/2]
        - ref: display # midpoint left
          shift: [-display_x/2, 0]
          affect: x
        - ref: display # display bottom left
          shift: [-display_x/2, -display_y/2]
        - ref: display # display bottom right
          shift: [display_x/2, -display_y/2]
        - ref: mcu # midpoint right
          shift: [0, -mcu_y/2]
          affect: y
        - ref: mcu # mcu bottom right
          shift: [mcu_x/2, 0]
          affect: x
        - ref: mcu # mcu top right
          shift: [mcu_x/2, mcu_y/2]
          affect: y
    #- what: rectangle
    #  size: [mcu_x, display_y]
    #  where: display
      expand: 1>
      operation: intersect
    #- what: rectangle
    #  size: [mcu_x, mcu_y]
    #  where: mcu
    #  adjust.shift: [0, -sy/2+mcu_y/2]
  _keycaps:
    - what: rectangle
      size: [kcx, kcy]
      where: [switches] # here it is! a tag
    - what: circle
      radius: 14.4/2 # measured from the knobs I have onhand
      where: encoder
      operation: stack
  _cutouts_mx:
    - what: rectangle
      size: kco
      where: [switches, encoder]
      corner: 0.5 # so they don't get filleted again down the line
  _cutouts_choc:
    - what: rectangle
      size: 13.8
      where: [[switches, -encoder]]
      corner: 0.5 # so they don't get filleted again down the line
    - what: rectangle
      size: [13.8, 15.5]
      where: [encoder]
      adjust.shift: [0, sy/2-7]
      corner: 0.5 # so they don't get filleted again down the line
  _ref_curve: # reference point
    - what: rectangle
      size: [4, 2]
      where: ref_curve
      adjust.shift: [0, sy/2]

# ==================== 3d ====================
# (present only in the 3d space) 
  _cutouts_mx_plate:
    - what: rectangle
      size: [5, 16]
      where: [switches]
      corner: 0.6
  _cutouts_encoder_pins:
    - what: rectangle
      size: [7, 14]
      where: [encoder]
      adjust.shift: [0, 1]
      corner: 0.5 # so they don't get filleted again down the line
  _bat_channel: #channel for the wires to go through, in a thicc plate
    - what: path 
      segments: # cw, jst>enc>mcu>switch>jst
        - type: line # INNER bezier
          points:
            - ref: mirror_jst # point 1, jst top left
              shift: [-jst_x/2-0.75, -jst_y/2]
            - ref: mirror_encoders # enc corner
              shift: [-12/2-1, kco/2+0.5] 
            - ref: mirror_encoders # enc pin edge
              shift: [-3-0.5, 8.25+0.5]
            - aggregate.method: intersect # enc to display
              aggregate.parts:
                - rotate: 90
                - ref: 
                  - ref: display
                    shift: [display_x/2, -display_y/2]
                  - ref: mirror_encoders
                    affect: [r]
            - orient: 
                ref: display
                shift: [display_x/2, -display_y/2]
            - ref: display # endpoint at mcu
              shift: [display_x/2, -display_y/2]
        - type: line 
          points:
            - shift: [0, 4] # aperture width
            - shift: [9, 1]
        - type: bezier # RIGHT, HEADING TO JST
          points:
            - ref: mirror_matrix_inner_home # handle, mcu > space
              shift: [kco/2, -0kco/2]
            - ref: 
              - ref: mirror_matrix_inner_home # switch corner
                affect: [x, y]
              shift: [kco/2-0.3, -kco/2+0.3]
        - type: line
          points:
            - ref: mirror_jst # point 1, jst top right
              shift: [jst_x/2-0.5, -jst_y/2]
    #- what: path
    #  segments:
    #    - type: bezier # LEFT
    #      points:
    #        - ref: mirror_jst # point 1, jst
    #          shift: [-jst_x/2-1, -jst_y/2+0.5]
    #        - ref: mirror_encoders # midpoint, enc corner
    #          shift: [-kco/2-1.5, kco/2+1.5] 
    #        - ref: display # endpoint, mcu
    #          shift: [display_x/2+kx/3, -display_y/2+1]
    #        - ref: display # endpoint, mcu
    #          shift: [display_x/2, -display_y/2+1.5]
    #    - type: line # MCU
    #      points:
    #        - shift: [0, 5]
    #        - shift: [2, 0]
    #    - type: bezier # RIGHT
    #      points:
    #        - ref: mirror_matrix_inner_home # midpoint, enc corner
    #          shift: [kco/2, -0kco/2]
    #        - ref: mirror_matrix_inner_home # handle
    #          shift: [kco/2, -kco/2]
    #        - ref: mirror_jst # point 1, jst
    #          shift: [jst_x/2-0.5, -jst_y/2+0.5]

  # ================= outlines =============== #
  # (useful combinations, or combos to be viewed)
  _components:
    - _mcu
    - ^_slider
    - ^_reset
    - ^_jst
    - ^_display
  _component_cutouts:
    - name: _reset
      expand: 1.4>
    - what: rectangle
      size: [jst_x+1.5, jst_y+1]
      adjust.shift: [0, -0.5]
      where: /jst/
      operation: stack
  pcb_view:
    - ^_pcb_body
    - ^_components
    - ^_mth_pcb
    - ^_bat_channel
    - what: rectangle
      where: [switches]
      size: kco
      operation: stack
  top_view:
    - body
    - -_mousebite_cuts
    - ^_component_cutouts
    - ^_center_cutout
    - ^_components
    - ^_keycaps
    - ^_mcu
  debug:
    - body
    - -_mousebite_cuts
    - ^_mth_pcb
    - ^_keycaps
    - ^_center_cutout
    - ^_components
    - ^_ref_curve
    - ^_bat_channel
  _plate_base:
    - name: body
      #fillet: 0.4
    - name: _component_cutouts
      operation: subtract
    #- name: _mth_plate
    #  operation: subtract
    - name: _center_cutout
      operation: subtract
      fillet: 1
  _mx_plate:
    - _plate_base
    - -_cutouts_mx
  mx_plate:
    - _mx_plate
    - -_mth_plate
  mx_plate_batchannel:
    - mx_plate
    - ^_bat_channel
  _choc_plate: 
    - _plate_base
    - -_cutouts_choc
  choc_plate: 
    - _choc_plate
    - -_mth_plate
  #_skeleton_case:
  #  - body
  #skeleton_case:
  #  - _skeleton_case
  #  - -_mth_plate
  #skeleton_case_extrude:
  #  - name: _main
